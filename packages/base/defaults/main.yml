---
# Empty on purpose. Setting a timezone somebody never asked for is rude, so the
# task only runs once a value is given.
devmachine_base_timezone: ""

# Same for the hostname: renaming an existing server without being asked is the
# same kind of rudeness. The CLI passes the machine's configured name.
devmachine_base_hostname: ""

# Upgrading every package on a machine is the owner's decision, not a side
# effect of installing base tools.
devmachine_base_upgrade: false

# Empty on purpose. Creating swap on somebody's machine because they installed
# base tools is the same rudeness as setting their timezone.
devmachine_base_swap: ""
