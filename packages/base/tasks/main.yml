---
- name: Load the package names for this family
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Refresh the package cache
  ansible.builtin.command: "{{ devmachine_package_cache_command }}"
  changed_when: false

- name: Upgrade the installed packages
  ansible.builtin.command: "{{ devmachine_package_upgrade_command }}"
  when: devmachine_base_upgrade | bool
  register: devmachine_base_upgrade_result
  changed_when: devmachine_base_upgrade_result.rc == 0

- name: Install the base packages
  ansible.builtin.package:
    name: "{{ devmachine_base_packages }}"
    state: present

- name: Read the current timezone
  ansible.builtin.command: timedatectl show --property=Timezone --value
  register: devmachine_current_timezone
  when: devmachine_base_timezone | length > 0
  changed_when: false

- name: Set the timezone
  ansible.builtin.command: "timedatectl set-timezone {{ devmachine_base_timezone }}"
  when:
    - devmachine_base_timezone | length > 0
    - devmachine_current_timezone.stdout != devmachine_base_timezone
  changed_when: true

- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ devmachine_base_hostname }}"
  when: devmachine_base_hostname | length > 0

- name: Configure tmux (extended keys plus the OSC 52 clipboard)
  ansible.builtin.copy:
    dest: /etc/tmux.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      set -s extended-keys on
      set -as terminal-features ',xterm*:extkeys'
      # Copying from tmux's copy-mode reaches the local clipboard through OSC 52
      # (some terminals need "applications may access the clipboard" turned on).
      # allow-passthrough lets a program inside tmux send OSC 52 out to the
      # terminal.
      set -g set-clipboard on
      set -g allow-passthrough on
      # This lives here, and not only in each user's ~/.tmux.conf: a tmux server
      # that came up before that file existed keeps the mouse off forever, and
      # then the mouse wheel turns into an up or down arrow inside any
      # full-screen program.
      set -g mouse on
      # Page Up enters the scrollback, as in a normal terminal. `-e` leaves by
      # itself on reaching the end again. A full-screen program (vim, less) gets
      # the key as always — `alternate_on` is what decides.
      bind -n PPage if-shell -F '#{alternate_on}' 'send-keys PPage' 'copy-mode -eu'
      bind -n NPage if-shell -F '#{alternate_on}' 'send-keys NPage' 'send-keys NPage'

- name: Install the `resume` command (a tmux session picker)
  ansible.builtin.copy:
    src: resume
    dest: /usr/local/bin/resume
    owner: root
    group: root
    mode: "0755"

# Empty by default on purpose. Creating swap on somebody's machine because they
# installed base tools is the same rudeness as setting their timezone.
- name: Look for an existing swapfile
  ansible.builtin.stat:
    path: /swapfile
  register: devmachine_base_swapfile
  when: devmachine_base_swap | length > 0

- name: Create the swapfile
  ansible.builtin.command: "fallocate -l {{ devmachine_base_swap }} /swapfile"
  when:
    - devmachine_base_swap | length > 0
    - not devmachine_base_swapfile.stat.exists

# A dry run against a machine with no swapfile yet cannot set the mode of a
# file that fallocate only pretends to create in check mode, and would fail
# saying so. The guard lets a dry run report nothing here, same as elsewhere
# in this repository.
- name: Keep the swapfile readable by root only
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"
  when:
    - devmachine_base_swap | length > 0
    - not ansible_check_mode or devmachine_base_swapfile.stat.exists | default(false)

- name: Format the swapfile
  ansible.builtin.command: mkswap /swapfile
  when:
    - devmachine_base_swap | length > 0
    - not devmachine_base_swapfile.stat.exists

- name: Turn the swapfile on
  ansible.builtin.command: swapon /swapfile
  when:
    - devmachine_base_swap | length > 0
    - not devmachine_base_swapfile.stat.exists

- name: Mount the swapfile on every boot
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
  when: devmachine_base_swap | length > 0
