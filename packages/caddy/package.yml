format: 1
name: caddy
scope: machine
summary: >-
  A reverse proxy that gets its own certificates, and a one-page site that
  answers 200 to prove the machine is reachable. Every other site is a file
  another package drops into /etc/caddy/sites.d.

needs: [firewall]

provides:
  sites.d: /etc/caddy/sites.d

requires:
  cli: ">= 0.2.0"

variables:
  email:
    summary: >-
      The address the certificate authority writes to about an expiring
      certificate. Empty means an anonymous account.
    default: ""
  local_certs:
    summary: >-
      Sign certificates locally instead of asking Let's Encrypt. For a machine
      no name resolves to — a test VM, a private network — where the ACME
      challenge can never succeed. Off, because a certificate nobody else
      trusts is not what a public site wants.
    default: false
  site:
    summary: >-
      Serve a one-page site straight from Caddy, no container behind it. It
      answers 200, which proves the name, the certificate and the proxy in one
      request. Off leaves the machine serving only what other packages add.
    default: true
  site_domain:
    summary: >-
      The name the one-page site answers to, with its own certificate. Empty
      serves it on port 80 at the machine's address, over plain HTTP, because
      no public authority signs a certificate for a bare address. It creates
      no DNS record: pointing the name is `devmachine dns add`.
    default: ""
