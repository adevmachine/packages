---
# The address Let's Encrypt writes to about an expiring certificate. Left empty,
# Caddy falls back to its own behaviour, which is an anonymous account.
devmachine_caddy_email: ""

# Off: a locally signed certificate is trusted by nobody, which is the wrong
# answer for every machine the internet can reach.
devmachine_caddy_local_certs: false

# On: a machine that just got Caddy should have one thing that answers, or
# there is nothing to point a first curl at.
devmachine_caddy_site: true

# Empty serves the page on port 80 at the machine's address.
devmachine_caddy_site_domain: ""
