format: 1
name: dev
scope: workspace
summary: >-
  The four tools a workspace is expected to have: the GitHub CLI, bun, the Node
  LTS through mise, and unzip. It installs gh and declares the login gh needs;
  one GitHub account normally serves every workspace on a machine.

needs: [workspace, mise]

requires:
  cli: ">= 0.4.0"

credentials:
  # scope: machine because one GitHub account serving every workspace is the
  # ordinary case, and a workspace that needs its own says so in the operator's
  # configuration. shareable: true because hosts.yml is a token in a file: a
  # copy of it works on another account, which is what the operator repository
  # has been doing by hand since before this CLI existed.
  - name: gh
    kind: login
    scope: machine
    shareable: true
    command: gh auth login
    stored_at: ~/.config/gh/hosts.yml

variables:
  home:
    summary: Where the account's home is.
    default: /home/<the account>
  gh_version:
    summary: >-
      Which GitHub CLI release to install. It is a release asset rather than a
      distribution package because most distributions do not carry gh at all.
    default: "2.63.2"
  node_version:
    summary: Which Node mise installs globally.
    default: lts
