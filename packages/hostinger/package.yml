format: 1
name: hostinger
scope: machine
kind: dns
summary: DNS zones on Hostinger.
entrypoint: bin/provider
commands: [zones, list, upsert, delete, help]
credentials:
  - name: hostinger
    kind: secret
    scope: machine
    env: HOSTINGER_API_TOKEN
requires:
  cli: ">= 0.4.0"

variables:
  zones:
    summary: >-
      DNS zones this provider may manage. Set this when the token has DNS
      permission without Domains portfolio permission; an empty list asks the
      account portfolio instead.
    default: []
