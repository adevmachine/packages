---
- name: Install fail2ban
  ansible.builtin.package:
    name: fail2ban
    state: present

- name: Configure the sshd jail
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  # A dry run on a machine that does not have the package yet cannot start a
  # service that does not exist, so check mode would report a failure that only
  # means "this is not installed" — which the rest of the run already said.
  when: not ansible_check_mode
