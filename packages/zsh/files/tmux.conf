# Mouse: select and scroll with the mouse, as in an ordinary terminal.
set -g mouse on

# OSC 52: a copy inside tmux reaches the clipboard of the computer you are
# connecting from, even over SSH. Without it a copy is stuck in the server's
# own clipboard, which nobody can paste from.
set -s set-clipboard on
set -as terminal-overrides ',xterm-256color:Ms=\E]52;c;%p2%s\007'
set -as terminal-overrides ',screen*:Ms=\E]52;c;%p2%s\007'
set -as terminal-overrides ',tmux*:Ms=\E]52;c;%p2%s\007'

# copy-mode-vi: y copies the selection, and sends it out through OSC 52.
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "tmux load-buffer -w -"

# Dragging a selection with the mouse copies on release, through OSC 52 as well.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "tmux load-buffer -w -"
