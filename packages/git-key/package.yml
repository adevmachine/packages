format: 1
name: git-key
scope: workspace
summary: One SSH key the whole machine pushes to a forge with, copied into each workspace.

needs: [workspace]

requires:
  cli: ">= 0.5.0"

variables:
  home:
    summary: Where the account's home is.
    default: /home/<the account>

credentials:
  - name: git-key
    kind: manual
    scope: machine
    shareable: true
    command: devmachine-make-git-key
    stored_at: ~/.ssh/id_ed25519
