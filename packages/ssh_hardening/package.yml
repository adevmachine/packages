format: 1
name: ssh_hardening
scope: machine
summary: >-
  Turns off password authentication for good. `setup` does this once, at first
  contact, before Ansible exists; this keeps it that way on every converge.

requires:
  cli: ">= 0.2.0"

variables:
  service:
    summary: >-
      What systemd calls sshd. Empty means the name this distribution family
      uses, which is `ssh` on Debian and Ubuntu and `sshd` elsewhere.
    default: ""
