---
- name: Load the repository names for this family
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Create the keyring directory
  ansible.builtin.file:
    path: "{{ devmachine_tailscale_keyring | dirname }}"
    state: directory
    mode: "0755"

- name: Download Tailscale's own signing key
  ansible.builtin.get_url:
    url: "{{ devmachine_tailscale_key_url }}"
    dest: "{{ devmachine_tailscale_keyring }}"
    mode: "0644"

- name: Add Tailscale's own repository
  ansible.builtin.copy:
    dest: "{{ devmachine_tailscale_repo_file }}"
    owner: root
    group: root
    mode: "0644"
    content: "{{ devmachine_tailscale_repo_line }}\n"
  register: devmachine_tailscale_repo

- name: Refresh the package cache
  ansible.builtin.command: "{{ devmachine_package_cache_command }}"
  when: devmachine_tailscale_repo is changed
  changed_when: false

- name: Install Tailscale
  ansible.builtin.package:
    name: tailscale
    state: present

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  # A dry run on a machine that does not have the package yet cannot start a
  # service that does not exist, so check mode would report a failure that only
  # means "this is not installed" — which the rest of the run already said.
  when: not ansible_check_mode

# Exit node: IPv4 and IPv6 forwarding has to be on in the host for tailscaled to
# route the peers' traffic (https://tailscale.com/kb/1103/exit-nodes). Off by
# default: routing somebody's traffic through their machine because they
# installed a VPN is the same rudeness as setting their timezone.
- name: Enable IP forwarding for the exit node
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-tailscale.conf
    content: |
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
    mode: "0644"
  register: devmachine_tailscale_sysctl
  when: devmachine_tailscale_exit_node | bool

- name: Reload the tailscale sysctl
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-tailscale.conf
  when: devmachine_tailscale_sysctl is changed
  changed_when: false
