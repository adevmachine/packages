format: 1
name: tailscale
scope: machine
summary: Joins the machine to a tailnet, so it is reachable without a public address.

requires:
  cli: ">= 0.5.0"

needs: [base]

variables:
  exit_node:
    summary: Advertise this machine as an exit node. Off unless asked for.
    default: false

credentials:
  # `shareable` answers a narrower question than it sounds like: whether a
  # copy of `stored_at` works on another Linux account on THIS machine — not
  # whether it works on another machine, which it never does (a tailnet state
  # identifies one machine, so copying it elsewhere does nothing useful). This
  # credential never reaches a workspace account at all: it lives outside
  # every home directory and only tailscaled on this one machine reads it.
  - name: tailscale
    kind: manual
    scope: machine
    shareable: true
    command: tailscale up
    stored_at: /var/lib/tailscale/tailscaled.state
